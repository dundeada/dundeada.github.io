# Netlify Configuration
# This enables form handling and serverless functions

[build]
  command = "echo 'Site ready for deployment'"
  publish = "."

# Form handling
[build.environment]
  NODE_VERSION = "18"

# Redirects for SPA support (if needed)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
